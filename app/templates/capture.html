<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capturar Examen - {{ task.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #video {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #canvas {
            display: none;
        }
        #preview {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .capture-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .status-badge {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 1000;
        }
        .loading-spinner {
            display: none;
        }
        .loading-spinner.active {
            display: inline-block;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.dashboard') }}">📝 Sistema de Exámenes</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('main.dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('main.logout') }}">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div id="statusBadge" class="status-badge"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="capture-container">
                    <h2 class="text-center mb-4">📸 Capturar Examen</h2>
                    <h5 class="text-center text-muted mb-4">{{ task.title }}</h5>

                    <div id="cameraSection">
                        <div class="text-center mb-3">
                            <video id="video" autoplay playsinline></video>
                        </div>
                        <div class="text-center">
                            <button id="captureBtn" class="btn btn-primary btn-lg">
                                📷 Capturar Imagen
                            </button>
                            <button id="uploadBtn" class="btn btn-secondary btn-lg ms-2">
                                📁 Subir Archivo
                            </button>
                            <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        </div>
                    </div>

                    <div id="previewSection" style="display: none;">
                        <div class="text-center mb-3">
                            <img id="preview" alt="Vista previa">
                        </div>
                        <div class="text-center">
                            <button id="processBtn" class="btn btn-success btn-lg">
                                <span class="loading-spinner spinner-border spinner-border-sm me-2" role="status"></span>
                                ✓ Procesar Examen
                            </button>
                            <button id="retakeBtn" class="btn btn-warning btn-lg ms-2">
                                🔄 Tomar Otra Foto
                            </button>
                        </div>
                    </div>

                    <div id="resultsSection" style="display: none;" class="mt-4">
                        <div class="alert alert-success text-center">
                            <h4>✓ Procesamiento Completado</h4>
                            <p class="mb-0">El examen ha sido procesado exitosamente</p>
                        </div>
                        <div id="resultsPreview" class="mt-3"></div>
                        <div class="text-center mt-3">
                            <a href="{{ url_for('main.view_results', task_id=task.id) }}" class="btn btn-primary btn-lg">
                                📊 Ver Resultados Completos
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const preview = document.getElementById('preview');
        const cameraSection = document.getElementById('cameraSection');
        const previewSection = document.getElementById('previewSection');
        const resultsSection = document.getElementById('resultsSection');
        const statusBadge = document.getElementById('statusBadge');
        const spinner = document.querySelector('.loading-spinner');

        let currentBlob = null;

        // Iniciar cámara
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } 
                });
                video.srcObject = stream;
                showStatus('Cámara iniciada', 'success');
            } catch (err) {
                console.error('Error al acceder a la cámara:', err);
                showStatus('Error al acceder a la cámara', 'danger');
                alert('No se pudo acceder a la cámara. Por favor, usa el botón "Subir Archivo".');
            }
        }

        function showStatus(message, type) {
            statusBadge.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                statusBadge.innerHTML = '';
            }, 3000);
        }

        // Capturar imagen
        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            canvas.toBlob((blob) => {
                currentBlob = blob;
                preview.src = URL.createObjectURL(blob);
                cameraSection.style.display = 'none';
                previewSection.style.display = 'block';
                showStatus('Imagen capturada', 'success');
            }, 'image/jpeg', 0.95);
        });

        // Subir archivo
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                currentBlob = file;
                preview.src = URL.createObjectURL(file);
                cameraSection.style.display = 'none';
                previewSection.style.display = 'block';
                showStatus('Imagen cargada', 'success');
            }
        });

        // Retomar foto
        retakeBtn.addEventListener('click', () => {
            cameraSection.style.display = 'block';
            previewSection.style.display = 'none';
            resultsSection.style.display = 'none';
            currentBlob = null;
        });

        // Procesar imagen
        processBtn.addEventListener('click', async () => {
            if (!currentBlob) {
                alert('No hay imagen para procesar');
                return;
            }

            processBtn.disabled = true;
            spinner.classList.add('active');
            showStatus('Procesando imagen con IA...', 'info');

            const formData = new FormData();
            formData.append('image', currentBlob, 'exam.jpg');

            try {
                const response = await fetch('{{ url_for("main.process_image", task_id=task.id) }}', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('¡Procesamiento exitoso!', 'success');
                    displayResults(data);
                    previewSection.style.display = 'none';
                    resultsSection.style.display = 'block';
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                console.error('Error:', error);
                showStatus('Error al procesar: ' + error.message, 'danger');
                alert('Error al procesar la imagen: ' + error.message);
            } finally {
                processBtn.disabled = false;
                spinner.classList.remove('active');
            }
        });

        function displayResults(data) {
            const resultsPreview = document.getElementById('resultsPreview');
            let html = `
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Resultados Preliminares</h5>
                        <div class="mb-3">
                            <strong>Matrícula:</strong> 
                            <span class="badge bg-primary fs-6">${data.matricula}</span>
                        </div>
                        <div>
                            <strong>Respuestas detectadas:</strong> ${data.respuestas.length}
                            <div class="mt-2" style="max-height: 200px; overflow-y: auto;">
            `;
            
            data.respuestas.forEach(r => {
                html += `<span class="badge bg-success me-1 mb-1">P${r.pregunta}: ${r.respuesta}</span>`;
            });
            
            html += `
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            resultsPreview.innerHTML = html;
        }

        // Iniciar cámara al cargar
        startCamera();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
